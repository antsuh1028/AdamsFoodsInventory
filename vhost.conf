<VirtualHost *:443>
    ServerName client.afdcstorage.com
    DocumentRoot "/opt/bitnami/apache/htdocs"
    <Directory "/opt/bitnami/apache/htdocs">
        AllowOverride All
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/client.afdcstorage.com.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/client.afdcstorage.com.key"
</VirtualHost>

<VirtualHost *:443>
    ServerName server.afdcstorage.com
    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/
    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/client.afdcstorage.com.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/client.afdcstorage.com.key"
</VirtualHost>
